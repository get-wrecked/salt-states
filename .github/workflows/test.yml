name: Tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    metadata-proxy:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  # What trixie ships, which is where the proxy runs
                  python-version: '3.13'

            - name: Install pytest
              run: pip install pytest

            - name: Run tests
              run: python -m pytest salt/metadata-proxy
